<section class="sec-faq sec-offset">
  <div class="sec-faq__container container">
    <span class="sec-faq__subtitle sec-subtitle" data-aos="fade-up">
      <svg>
        <use xlink:href="img/sprite.svg#marker-blue"></use>
      </svg>
      <span>Вопрос-ответ</span>
    </span>
    <!-- Шапка секции -->
    <div class="sec-faq__heading">
      <h2 class="sec-faq__title sec-title" data-aos="fade-up" data-aos-delay="200">Часто задаваемые вопросы</h2>
      <div class="sec-faq__accordion accordion" data-aos="fade-up" data-aos-delay="400">
        <div class="accordion__item">
          <button class="accordion__control" type="button">
            <span class="accordion__title"
              >Какая производительность у дистиллятора Liston?</span
            >
            <span class="accordion__icon">
              <svg class="link-chevron__icon">
                <use xlink:href="img/sprite.svg#chevrons-right"></use>
              </svg>
            </span>
          </button>
          <div class="accordion__content" aria-hidden="true">
            <div class="accordion__body">
              <p>4, 10 и 25 литров в час.</p>
            </div>
          </div>
        </div>

        <div class="accordion__item">
          <button class="accordion__control" type="button">
            <span class="accordion__title">Нужен ли внешний охладитель?</span>
            <span class="accordion__icon">
              <svg class="link-chevron__icon">
                <use xlink:href="img/sprite.svg#chevrons-right"></use>
              </svg>
            </span>
          </button>
          <div class="accordion__content" aria-hidden="true"></div>
        </div>

        <div class="accordion__item">
          <button class="accordion__control" type="button">
            <span class="accordion__title"
              >Как часто нужно чистить дистиллятор?</span
            >
            <span class="accordion__icon">
              <svg class="link-chevron__icon">
                <use xlink:href="img/sprite.svg#chevrons-right"></use>
              </svg>
            </span>
          </button>
          <div class="accordion__content" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>
</section>
