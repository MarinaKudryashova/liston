<div class="graph-modal">

  <div class="graph-modal__container" role="dialog" aria-modal="true" data-graph-target="modal-leadform">
    <div class="graph-modal__content contact-form">
      <div class="graph-modal__header">
        <span class="contact-form__subtitle sec-subtitle">
          <svg>
            <use xlink:href="img/sprite.svg#marker-blue"></use>
          </svg>
          <span>Для связи</span>
        </span>
        <h2 class="contact-form__title">Заказать звонок</h2>
        <p class="contact-form__descr">
          Если у вас есть вопросы или вы нуждаетесь в какой-то информации, пожалуйста, заполните контактную форму,
          чтобы запросить необходимую информацию. Мы будем рады вам помочь.
        </p>
        <button class="btn-reset js-modal-close graph-modal__close" aria-label="Закрыть модальное окно">
          <svg>
            <use xlink:href="img/sprite.svg#close"></use>
          </svg>
        </button>
      </div>
      <div class="contact-form__form form">
        <div class="form__content">
          <div class="form__field form-field form-field--required">
            <label class="form-field__label" for="name">Имя</label>
            <input class="form-field__input" type="text" id="name" placeholder="Иван">
            <button class="form-field__btn-clear" type="button" aria-label="Очистить поле ввода">
              <svg>
                <use xlink:href="img/sprite.svg#close"></use>
              </svg>
            </button>
            <span class="form-field__error">Неверное значение</span>
          </div>
          <div class="form__field form-field form-field--required">
            <label class="form-field__label" for="phone">Телефон</label>
            <input class="form-field__input" type="text" id="phone" placeholder="+7 ___ ___ ____">
            <button class="form-field__btn-clear" type="button" aria-label="Очистить поле ввода">
              <svg class="header-bottom__icon">
                <use xlink:href="img/sprite.svg#close"></use>
              </svg>
            </button>
            <span class="form-field__error">Неверное значение</span>
          </div>
          <div class="form__control">
            <div class="form__agree form-agree">
              <label class="form-agree__label" for="agree">
                <input class="form-agree__input visually-hidden" type="checkbox" id="agree">
                <span>
                  Я ознакомлен(-а) и согласен(-на) с <a href="#">Политикой конфиденциальности</a> и даю свое
                  согласие на обработку своих персональных данных в соответствии с указанными условиями
                </span>
                <span class="form-agree__icon">
                  <svg>
                    <use xlink:href="img/sprite.svg#check"></use>
                  </svg>
                </span>
              </label>
            </div>
            <button class="form__btn ui-btn" type="submit">Отправить</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="graph-modal__container" role="dialog" aria-modal="true" data-graph-target="modal-send">
    <button class="btn-reset js-modal-close graph-modal__close" aria-label="Закрыть модальное окно">
      <svg>
        <use xlink:href="img/sprite.svg?v=2#close"></use>
      </svg>
    </button>
    <div class="graph-modal__content message-success">
      <span class="message-success__subtitle sec-subtitle">
          <svg>
            <use xlink:href="img/sprite.svg#marker-blue"></use>
          </svg>
          <span>Ожидайте звонка</span>
        </span>
      <h3 class="message-success__title">Спасибо!</h3>
      <p class="message-success__text">Ваша заявка принята!</p>
    </div>
  </div>
</div>
